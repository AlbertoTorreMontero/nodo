<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nodo">
<meta name="description" content="Aprende SQL, IA, Rust y Python haciendo: lecciones interactivas paso a paso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nodo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Plan: lienzo gris-azulado muy suave, tarjetas blancas flotantes, un color por curso (--c). Una columna central de lección como Brilliant; mapa de nodos en zigzag por curso. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F7F9FB; --ink:#17202A; --muted:#5D6977; --line:#E1E6EC;
  --good:#16956A; --good-bg:#E5F6EF; --bad:#CF3F57; --bad-bg:#FCEBEE; --warn:#B7791F;
  --sql:#0E8C83; --ia:#6A4FE0; --rust:#CF5A27; --py:#C28A0A;
  --c:#0E8C83; --c-soft:color-mix(in oklab, var(--c) 12%, var(--surface));
  --shadow:0 1px 2px rgba(20,30,45,.05), 0 8px 24px rgba(20,30,45,.07);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#19212A; --surface2:#1F2832; --ink:#E8EDF2; --muted:#9AA7B4; --line:#2B3641;
    --good:#3CC48F; --good-bg:#15322A; --bad:#F06B80; --bad-bg:#3A1E25;
    --sql:#2BB9AE; --ia:#9583F5; --rust:#F0844F; --py:#E2AE36;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --surface2:#1F2832; --ink:#E8EDF2; --muted:#9AA7B4; --line:#2B3641;
  --good:#3CC48F; --good-bg:#15322A; --bad:#F06B80; --bad-bg:#3A1E25;
  --sql:#2BB9AE; --ia:#9583F5; --rust:#F0844F; --py:#E2AE36;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in oklab,var(--c) 60%,transparent);outline-offset:2px;border-radius:8px}
code,pre,.mono{font-family:var(--mono);font-size:.88em}
p code,li code,.body code{background:var(--surface2);border:1px solid var(--line);padding:.05em .35em;border-radius:6px}
a{color:var(--c)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--display);letter-spacing:-.02em;background:none;border:0;padding:0}
.logo svg{width:28px;height:28px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}

/* Home */
.hero{padding:40px 0 8px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end}
.hero h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.025em}
.hero p{color:var(--muted);max-width:56ch;margin:12px 0 0}
.resume{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.resume .dot{width:46px;height:46px;border-radius:14px;background:var(--c-soft);display:grid;place-items:center;color:var(--c);flex:none}
.resume small{color:var(--muted);display:block;font-size:13px}
.resume b{display:block;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in oklab,var(--c) 70%,#000);transition:transform .08s, box-shadow .08s, opacity .2s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in oklab,var(--c) 70%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.sm{padding:8px 14px;border-radius:11px;font-size:14px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:28px 0 60px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column}
.ccard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,45,.06),0 16px 36px rgba(20,30,45,.1)}
.ccard .art{height:130px;background:var(--c-soft);position:relative}
.ccard .art canvas{width:100%;height:100%;display:block}
.ccard .info{padding:16px 18px 18px;display:grid;gap:6px}
.ccard h3{font-size:21px}
.ccard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.method{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 0 26px}
.method div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted)}
.method b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:2px}

/* Course */
.chead{padding:30px 0 6px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.chead h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em}
.chead p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;display:flex;gap:6px;align-items:center;margin-bottom:12px}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:20px 0 70px}
.unit{margin-bottom:26px}
.unit-h{display:flex;gap:14px;align-items:center;background:var(--c);color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 3px 0 color-mix(in oklab,var(--c) 70%,#000)}
.unit-h .n{font:800 13px/1 var(--display);opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.unit-h h2{font-size:20px}
.unit-h p{margin:2px 0 0;font-size:14px;opacity:.9}
.path{position:relative;padding:18px 0 4px;display:grid;gap:14px}
.node{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;width:max-content;max-width:100%}
.node .disc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);flex:none;transition:transform .12s;color:var(--muted)}
.node.proj .disc{border-radius:18px}
.node:hover .disc{transform:translateY(-2px)}
.node .disc svg{width:26px;height:26px}
.node.done .disc{background:var(--c);border-color:var(--c);box-shadow:0 4px 0 color-mix(in oklab,var(--c) 70%,#000);color:#fff}
.node.next .disc{border-color:var(--c);color:var(--c);box-shadow:0 4px 0 color-mix(in oklab,var(--c) 45%,var(--line));animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:6px solid color-mix(in oklab,var(--c) 18%,transparent)}}
.node .lbl b{display:block;font-weight:700;line-height:1.25}
.node .lbl small{color:var(--muted);font-size:13px}
.side{display:grid;gap:16px;align-content:start;position:sticky;top:80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:8px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card li{margin:4px 0}
.ring{display:flex;gap:14px;align-items:center}
.ring svg{width:64px;height:64px;flex:none}
.cert{border:2px dashed color-mix(in oklab,var(--c) 50%,var(--line))}
.cert.on{border-style:solid;background:var(--c-soft)}

/* Lesson player */
.lesson{min-height:100%;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:860px;width:100%;margin:0 auto}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.segs{display:flex;gap:5px;flex:1}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .3s}
.segs i.on{background:var(--c)}
.segs i.cur{background:color-mix(in oklab,var(--c) 45%,var(--line))}
.stage{flex:1;width:100%;max-width:760px;margin:0 auto;padding:10px 20px 170px}
.step{animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kicker{font-size:13px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.step h2{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.015em;margin-bottom:12px}
.body{font-size:17.5px;line-height:1.65;max-width:66ch}
.body p{margin:0 0 12px}
.body ul{margin:0 0 12px;padding-left:22px}
.body li{margin:4px 0}
.note{background:var(--c-soft);border-radius:14px;padding:12px 16px;font-size:15.5px;margin:14px 0;border-left:4px solid var(--c)}
.q{font-size:18px;font-weight:600;margin:6px 0 16px;max-width:66ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 3px 0 var(--line);transition:border-color .12s, transform .08s;font-size:16px;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover{border-color:color-mix(in oklab,var(--c) 40%,var(--line))}
.opt.sel{border-color:var(--c);box-shadow:0 3px 0 color-mix(in oklab,var(--c) 50%,var(--line))}
.opt.sel .k{border-color:var(--c);color:var(--c)}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 color-mix(in oklab,var(--good) 50%,var(--line))}
.opt.no{border-color:var(--bad);background:var(--bad-bg);opacity:.8}
.opt code{font-size:.92em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:14px 0}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow-x:auto;margin:12px 0;line-height:1.55;font-size:14px;position:relative}
.codehead{display:flex;justify-content:space-between;align-items:center;font:600 12.5px var(--mono);color:var(--muted);margin:12px 0 -6px;padding:0 4px}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font:600 12px var(--body)}
.fillcode{white-space:pre-wrap;font-family:var(--mono);font-size:15px;line-height:2.1;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow-x:auto}
.fillcode input{font:inherit;border:0;border-bottom:2px solid var(--c);background:var(--c-soft);color:var(--ink);padding:2px 6px;border-radius:6px 6px 0 0;min-width:3ch;text-align:center;outline:none}
.fillcode input.ok{border-color:var(--good);background:var(--good-bg)}
.fillcode input.no{border-color:var(--bad);background:var(--bad-bg)}
.orderbox{display:grid;gap:8px;min-height:60px;padding:12px;border:2px dashed var(--line);border-radius:16px;margin-bottom:12px;background:var(--surface2)}
.orderbox.pool{border-style:solid;background:transparent;border-color:transparent;padding:0}
.chip{font-family:var(--mono);font-size:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:0 2px 0 var(--line);white-space:pre}
.chip:hover{border-color:var(--c)}
.lines{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 0;font-family:var(--mono);font-size:14px;overflow-x:auto}
.lines button{display:flex;width:100%;text-align:left;border:0;background:none;padding:3px 14px;white-space:pre;gap:14px}
.lines button .ln{color:var(--muted);opacity:.6;width:2ch;text-align:right;flex:none}
.lines button:hover{background:var(--c-soft)}
.lines button.sel{background:color-mix(in oklab,var(--c) 22%,transparent)}
.lines button.ok{background:var(--good-bg)} .lines button.no{background:var(--bad-bg)}

/* Editors */
.ed{display:grid;gap:10px}
.ed textarea{width:100%;min-height:130px;resize:vertical;font:14.5px/1.55 var(--mono);background:var(--surface2);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;tab-size:2;outline:none}
.ed textarea:focus{border-color:var(--c)}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edbar .hint{color:var(--muted);font-size:13px;margin-left:auto}
.schema{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.schema span{font:12.5px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--muted)}
.schema span b{color:var(--c);font-weight:600}
.res{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.res table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.res th{position:sticky;top:0;background:var(--surface2);text-align:left;font:600 12.5px var(--mono);color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line)}
.res td{padding:7px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);white-space:nowrap}
.res .empty{padding:14px;color:var(--muted);font-size:14px}
.err{color:var(--bad);font:13.5px var(--mono);padding:10px 12px;background:var(--bad-bg);border-radius:12px;white-space:pre-wrap}
.console{font:13.5px/1.5 var(--mono);background:#0F1720;color:#D9E3EC;border-radius:14px;padding:12px 14px;min-height:54px;white-space:pre-wrap;max-height:260px;overflow:auto}
.status{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.checks{display:grid;gap:8px;margin:12px 0}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.checks input{accent-color:var(--c);width:18px;height:18px;margin-top:3px}

/* Feedback bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);transition:background .2s}
.foot .in{max-width:760px;margin:0 auto;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:16px;align-items:center}
.foot .msg{flex:1;min-width:0}
.foot .msg b{font-family:var(--display);font-size:19px;display:flex;gap:8px;align-items:center}
.foot .msg p{margin:2px 0 0;font-size:15px;max-height:120px;overflow:auto}
.foot.good{background:var(--good-bg)} .foot.good b{color:var(--good)} .foot.good .btn{background:var(--good);box-shadow:0 3px 0 color-mix(in oklab,var(--good) 70%,#000)}
.foot.bad{background:var(--bad-bg)} .foot.bad b{color:var(--bad)} .foot.bad .btn{background:var(--bad);box-shadow:0 3px 0 color-mix(in oklab,var(--bad) 70%,#000)}

/* Finish */
.finish{text-align:center;padding:60px 20px;max-width:560px;margin:0 auto}
.finish h1{font-size:40px;font-weight:800;margin:16px 0 6px}
.stats{display:flex;gap:12px;justify-content:center;margin:24px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 20px;min-width:120px}
.stats b{display:block;font:800 26px var(--display);color:var(--c);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted)}

/* Widgets */
.w{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:16px 0}
.w canvas{width:100%;display:block;border-radius:12px;background:var(--surface2);touch-action:none}
.w .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}
.w label{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.w input[type=range]{accent-color:var(--c);width:150px}
.w .readout{font:600 14px var(--mono);padding:6px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.w .goal{font-size:14px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center}
.w .goal.ok{color:var(--good);font-weight:600}
.w select,.w input[type=text]{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toks{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.toks span{font:14px var(--mono);padding:4px 7px;border-radius:7px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.toks span small{font-size:10.5px;opacity:.7}
.trace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
.trace .mem{position:relative;min-height:200px;background:var(--surface2);border-radius:14px;border:1px solid var(--line);padding:12px 12px 12px 34px}
.trace .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;position:relative;z-index:1}
.trace h4{margin:0 0 8px;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:13px var(--mono);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;transition:opacity .3s}
.slot.dead{opacity:.35;text-decoration:line-through}
.slot.hot{border-color:var(--c)}
.trace svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.tmsg{font-size:14.5px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.tmsg.err{background:var(--bad-bg);color:var(--bad);font-family:var(--body)}
.lines .cur{background:color-mix(in oklab,var(--c) 18%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sess{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface2)}
.sess h4{margin:0 0 8px;font:700 14px var(--display);display:flex;justify-content:space-between}
.sess .acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sess .acts button{font:12.5px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px}
.sess .acts button:hover{border-color:var(--c)}
.sess .log{font:12.5px/1.5 var(--mono);min-height:90px;max-height:170px;overflow:auto;background:var(--surface);border-radius:10px;padding:8px;border:1px solid var(--line)}
.badge{font:700 11px var(--body);padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.open{background:color-mix(in oklab,var(--warn) 20%,transparent);color:var(--warn)}


/* ---------- Móvil ---------- */
.mobinfo{display:none}
html{-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overscroll-behavior-y:none}
button,.opt,.chip,.node,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
.ltop{padding-top:calc(14px + env(safe-area-inset-top))}
.node{margin-left:var(--off,0)}
.kbd{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kbd::-webkit-scrollbar{display:none}
.kbd button{flex:none;font:600 13px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px;box-shadow:0 2px 0 var(--line)}
.kbd button:active{transform:translateY(1px);box-shadow:none}
@media (hover:hover){.kbd{display:none}}
@media (max-width:600px){
  body{font-size:15.5px}
  .wrap{padding:0 16px}
  .top .wrap{height:54px}
  .logo{font-size:20px}
  .pill{padding:5px 10px;font-size:13px}
  .hero{padding:22px 0 0;gap:18px}
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .resume{padding:14px}
  .courses{grid-template-columns:1fr;gap:14px;padding:20px 0 28px}
  .ccard{flex-direction:row;border-radius:18px;min-height:118px}
  .ccard .art{width:104px;height:auto;flex:none}
  .ccard .info{padding:12px 14px;gap:3px}
  .ccard h3{font-size:18px}
  .ccard p{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .method{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .method div{padding:12px 14px}
  .chead{padding:16px 0 0;gap:12px}
  .chead .btn{width:100%}
  .cbody{padding:14px 0 calc(40px + env(safe-area-inset-bottom));gap:18px}
  .side{order:-1;grid-template-columns:1fr}
  .mobinfo{display:inline-flex}
  .side .card:not(:first-child){display:none}
  .side.open .card{display:block}
  .unit-h{padding:12px 14px;border-radius:16px}
  .unit-h h2{font-size:18px}
  .node{margin-left:calc(var(--off,0) * .45);width:auto}
  .fillcode{line-height:2}
  .node .disc{width:56px;height:56px}
  .node .lbl b{font-size:15px}
  .ltop{padding-left:14px;padding-right:14px;gap:10px}
  .x{width:38px;height:38px}
  .stage{padding:6px 16px calc(190px + env(safe-area-inset-bottom))}
  .step h2{font-size:23px;margin-bottom:10px}
  .body{font-size:16px;line-height:1.6}
  .q{font-size:16.5px;margin-bottom:12px}
  .opt{padding:13px 14px;font-size:15.5px;min-height:52px}
  pre.code{font-size:12.5px;padding:12px;border-radius:12px}
  .fillcode{font-size:13.5px;line-height:2.2;padding:12px}
  .fillcode input{font-size:16px;padding:3px 4px}
  .chip{font-size:12.5px;white-space:pre-wrap;word-break:break-word;padding:10px 12px}
  .lines{font-size:12.5px}
  .lines button{padding:7px 12px}
  .ed textarea{font-size:16px;min-height:150px;padding:12px}
  .w{padding:12px;margin:12px -4px;border-radius:16px}
  .w .row{gap:10px}
  .w label{flex:1 1 100%;justify-content:space-between}
  .w input[type=range]{flex:1;width:auto;height:28px}
  .w select,.w input[type=text]{font-size:16px}
  .seg button{padding:8px 12px}
  .foot .in{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-direction:column;align-items:stretch;gap:10px}
  .foot .msg:empty{display:none}
  .foot .msg b{font-size:17px}
  .foot .msg p{font-size:14px;max-height:30vh}
  .foot .btn{width:100%;padding:14px;font-size:16px}
  .finish{padding:40px 16px}
  .finish h1{font-size:30px}
  .stats div{min-width:0;flex:1;padding:12px 8px}
  .trace .mem{padding-left:30px}
  .sess .acts button{padding:7px 9px}
}
@media (max-width:420px){ .method{grid-template-columns:1fr} .body{font-size:16px} }

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .cbody{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .method{grid-template-columns:1fr 1fr}
  .trace,.grid2{grid-template-columns:1fr}
  .chead{grid-template-columns:1fr}
}
